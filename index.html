<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DevVault — a personal developer command center for projects, tasks, snippets, resources and DSA practice." />
  <title>DevVault · Developer Command Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23170d12'/%3E%3Cpath d='M15 15l9 17-9 17' stroke='%23d98885' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='31' y='42' width='18' height='7' rx='3.5' fill='%23e7a6a0'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-vault" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13Zm4.5 3.2 3.2 3.8-3.2 3.8m5.3.4h4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 3 4 7v10l8 4 8-4V7l-8-4Zm0 0 4.2 2.1M4 7l8 4m0 0 8-4m-8 4v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 8-4.5 4L8 16m8-8 4.5 4L16 16m-2.5-11-3 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5v-15ZM5 19.5V21h14v-3M9 7.5h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-dsa" viewBox="0 0 24 24"><path d="M5 5h4v4H5zM15 15h4v4h-4zM7 9v6a2 2 0 0 0 2 2h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16M7 16v-5m5 5V7m5 9v-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5v2.3m0 12.4v2.3M3.5 12h2.3m12.4 0h2.3M6 6l1.7 1.7m8.6 8.6L18 18M18 6l-1.7 1.7M7.7 16.3 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16v4ZM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5m4-5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6m-6-6 6 6M20 4l-8.5 8.5M9 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9.5 12 15.5l6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 16v3.5h14V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m0 0 4.5-4.5M12 16l-4.5-4.5M5 16v3.5h14V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5Z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M5.5 8.5A8 8 0 1 1 4 13.5M5.5 8.5V3.8m0 4.7h4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 6h4l8 12h4M20 6h-4l-2.2 3.3M4 18h4l2.2-3.3M17.5 3.5 20 6l-2.5 2.5M17.5 15.5 20 18l-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3s5.5 4.2 5.5 9.5a5.5 5.5 0 0 1-11 0c0-2 1-3.9 2-5.2.4 1.4 1.3 2.2 2.3 2.2C11.7 9.5 12 6.5 12 3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10m-7 6h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 13.5A8.5 8.5 0 0 1 10.5 4 8.5 8.5 0 1 0 20 13.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6m9.6 9.6 1.6 1.6m0-12.8-1.6 1.6M7.2 16.8l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13m0 0-5-5m5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5l-1.8-5.9L4.5 10.8 10.2 9 12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <div id="app-root">
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-mark">
        <span class="boot-brace">{</span><span class="boot-cursor"></span><span class="boot-brace">}</span>
      </div>
      <div class="boot-bar"><i></i></div>
    </div>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark"><svg><use href="#i-vault"/></svg></span>
          <span class="brand-name">Dev<b>Vault</b></span>
        </div>
        <nav class="side-nav" id="side-nav" aria-label="Primary"></nav>
        <div class="sidebar-foot">
          <div class="vault-meter" id="vault-meter">
            <div class="vault-meter-head">
              <svg class="ic"><use href="#i-flame"/></svg>
              <span>Vault fuel</span>
              <b id="vault-meter-value">0%</b>
            </div>
            <div class="meter-track"><i id="vault-meter-bar"></i></div>
            <p class="vault-meter-note" id="vault-meter-note">Keep building.</p>
          </div>
          <div class="side-user">
            <span class="side-avatar" id="side-avatar">D</span>
            <div class="side-user-meta">
              <b id="side-username">Developer</b>
              <span id="side-user-role">command center</span>
            </div>
            <button class="icon-btn" id="settings-shortcut" title="Settings" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
          </div>
        </div>
      </aside>
      <div class="sidebar-scrim" id="sidebar-scrim"></div>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn only-mobile" id="nav-toggle" aria-label="Open navigation" aria-expanded="false"><svg class="ic"><use href="#i-menu"/></svg></button>
          <div class="topbar-locator" id="topbar-locator">Dashboard</div>
          <button class="search-launch" id="search-launch" type="button">
            <svg class="ic"><use href="#i-search"/></svg>
            <span>Search everything</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle theme"><svg class="ic"><use href="#i-moon"/></svg></button>
        </header>
        <div id="view-root" class="view-root" tabindex="-1"></div>
      </main>
    </div>
  </div>

  <div class="layer" id="modal-layer" hidden>
    <div class="scrim" data-close-modal></div>
    <div class="modal-holder" id="modal-holder" role="dialog" aria-modal="true"></div>
  </div>

  <div class="layer" id="search-layer" hidden>
    <div class="scrim" data-close-search></div>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Global search">
      <div class="search-input-row">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="search-input" type="text" placeholder="Search projects, tasks, snippets, resources…" autocomplete="off" />
        <button class="icon-btn" data-close-search aria-label="Close search"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="search-body" id="search-body">
        <div class="search-hint">
          <p><b>Pro tip:</b> everything you own lives in one vault — try <em>sort</em>, <em>react</em>, or a project name.</p>
          <div class="search-hint-tags" id="search-hint-tags"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toaster" id="toaster" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden />

  <script src="script.js"></script>
</body>
</html>
